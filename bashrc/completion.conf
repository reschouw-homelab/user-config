#!/bin/bash

# Git tab-completion.
#
# Sources the first git-completion.bash found across the common locations on
# macOS and Linux. Works on the system bash 3.2 (Apple ships a 3.2-compatible
# script with the Command Line Tools). Silent if none is found.

git_completion_candidates=(
  /Library/Developer/CommandLineTools/usr/share/git-core/git-completion.bash  # macOS CLT
  "$(xcode-select -p 2>/dev/null)/usr/share/git-core/git-completion.bash"     # macOS Xcode
  /opt/homebrew/etc/bash_completion.d/git-completion.bash                     # brew (Apple Silicon)
  /usr/local/etc/bash_completion.d/git-completion.bash                        # brew (Intel)
  /usr/share/bash-completion/completions/git                                  # Linux
  /etc/bash_completion.d/git                                                  # Linux (older)
)

for _gc in "${git_completion_candidates[@]}"; do
  if [ -r "$_gc" ]; then
    # shellcheck disable=SC1090  # dynamic path resolved at runtime
    . "$_gc"
    break
  fi
done

unset _gc git_completion_candidates
