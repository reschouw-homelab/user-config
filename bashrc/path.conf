#!/bin/bash

# Add bin directories
export PATH="$HOME/.bin:$PATH"
export PATH="$HOME/bin:$PATH"
export PATH="$HOME/.local/bin:$PATH"

# Silence macOS's "default shell is now zsh" deprecation nag (harmless elsewhere)
export BASH_SILENCE_DEPRECATION_WARNING=1

# Load Homebrew's bash-completion, but only on bash >= 4. The formula's scripts
# use options (e.g. `complete -o nosort`) that the system bash 3.2 rejects.
if [[ ${BASH_VERSINFO[0]} -ge 4 && -r "/opt/homebrew/etc/profile.d/bash_completion.sh" ]]; then
  # shellcheck disable=SC1091  # external file, not present at lint time
  . "/opt/homebrew/etc/profile.d/bash_completion.sh"
fi
